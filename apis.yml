name: Newfront Insurance
description: 'Newfront is a technology-native insurance brokerage ("a brokerage for
  the 21st century") serving startups through Fortune 500 enterprises, and now part
  of WTW. It places business insurance (property, casualty, cyber, executive risk,
  workers'' compensation, surety, aviation, M&A and global programs) alongside Total
  Rewards services (employee benefits, compensation, retirement/401(k), HR, payroll
  and benefits compliance), pairing brokerage expertise with in-house software such
  as the Navigator benefits platform, RiskPulse analytics, and contract/coverage-gap
  review tools. Newfront reports roughly 20% of U.S. unicorns as clients and $3.1B
  in annual premiums placed. The company exposes no public developer API, documentation,
  developer portal, SDKs, or webhooks; client and employee interaction happens through
  the authenticated app.newfront.com application. This profile was surfaced as a VC
  portfolio company and enriched with company identity and domain-security posture.'
